<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — v1.0.0</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d161f;
    color: #f0f5f9;
    font: 18px/1.45 system-ui, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hc-toggle {
    position: fixed;
    top: 10px;
    right: 16px;
    z-index: 20;
    font: 700 16px system-ui, "Segoe UI", Arial, sans-serif;
    padding: 7px 14px;
    border-radius: 8px;
    border: 2px solid #8fb3c9;
    background: #172533;
    color: #f0f5f9;
    cursor: pointer;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 15, 24, 0.72);
    backdrop-filter: blur(5px);
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .card {
    background: #172533;
    border: 2px solid #d4a359;
    border-radius: 14px;
    padding: 28px 34px;
    min-width: 460px;
    max-width: 720px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  }
  .card h1, .card h2 {
    margin: 0 0 14px;
    font-size: 28px;
    color: #ffe0a3;
  }
  .card p, .card li {
    font-size: 19px;
    margin: 8px 0;
    color: #e6eff6;
  }
  .card ul { margin: 10px 0 16px; padding-left: 24px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .shop-box {
    background: #101b27;
    border: 1px solid #35506b;
    border-radius: 10px;
    padding: 16px;
  }
  .shop-box h3 { margin: 0 0 8px; font-size: 21px; color: #ffd685; }
  button {
    font: 600 18px system-ui, "Segoe UI", Arial, sans-serif;
    padding: 11px 22px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    background: #e09132;
    color: #161006;
  }
  button.secondary { background: #30475e; color: #f0f5f9; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .muted { color: #b7c8d6; font-size: 18px; }

  /* Chế độ tương phản cao (High-Contrast Mode) */
  body.hc {
    background: #000000;
    color: #ffffff;
  }
  body.hc .hc-toggle {
    background: #ffff00;
    color: #000000;
    border: 3px solid #ffffff;
  }
  body.hc .overlay {
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: none;
  }
  body.hc .card {
    background: #000000;
    border: 3px solid #ffff00;
    box-shadow: none;
  }
  body.hc .card h1, body.hc .card h2 { color: #ffff00; }
  body.hc .card p, body.hc .card li { color: #ffffff; }
  body.hc .muted { color: #e0e0e0; }
  body.hc .shop-box {
    background: #000000;
    border: 2px solid #00ffff;
  }
  body.hc .shop-box h3 { color: #00ffff; }
  body.hc button {
    background: #ffff00;
    color: #000000;
    border: 2px solid #ffffff;
    font-weight: 700;
  }
  body.hc button.secondary {
    background: #111111;
    color: #ffffff;
    border: 2px solid #ffffff;
  }
  body.hc button:focus-visible, body.hc .hc-toggle:focus-visible {
    outline: 3px solid #00ffff;
    outline-offset: 2px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="hc-hud-btn" class="hc-toggle" type="button" title="Phím H">[H] Tương phản cao: TẮT</button>
<div id="overlay" class="overlay"><div id="card" class="card"></div></div>
<script>
"use strict";
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const overlayEl = document.getElementById("overlay");
const cardEl = document.getElementById("card");
const hcHudBtn = document.getElementById("hc-hud-btn");

const KIND_COLOR = {
  ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066",
  bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b"
};
const KIND_COLOR_HC = {
  ca_loc: "#76ff03", ca_linh: "#ffffff", ca_keo: "#ffab00",
  bong_dien_dien: "#ffff00", bong_sung: "#ff80ab", keo_neo: "#00e5ff"
};
const KIND_NAME = {
  ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo",
  bong_dien_dien: "Bông điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây"
};

const PALETTE = {
  normal: {
    frameBg: "#10161c",
    sky: "#cfeaf5",
    waterStops: ["#49b0dc", "#236c94", "#071f36"],
    surfaceLine: "#e9f7ff",
    depthLine: "rgba(255,255,255,.16)",
    depthText: "rgba(255,255,255,.55)",
    dockFill: "#8d6e4b",
    dockRoof: "#b9503a",
    dockRing: "rgba(255,230,150,.75)",
    dockText: "#5a3a22",
    nodeText: "#123",
    fishText: "rgba(255,255,255,.85)",
    monsterIdle: "#5d8c4a",
    monsterChase: "#e53935",
    monsterRecoil: "#b388ff",
    monsterStroke: "#1b2e13",
    player: "#ff8a3d",
    playerRing: "rgba(255,255,255,.35)",
    floor: "#c9a36b",
    floorBorder: "#6b4a2b",
    stoveIdle: "#6d6d72",
    stoveCook: "#e8892b",
    stoveReady: "#6fbf5a",
    tableFill: "#8a5a2e",
    custWait: "#f4b6c2",
    custEat: "#7bc67b",
    hudMain: "#f0f5f9",
    hudMuted: "#b9cad8",
    hudHint: "#9fb3c0",
    alertMonsterBg: "rgba(32, 8, 52, 0.92)",
    alertMonsterBorder: "#d580ff",
    alertMonsterFg: "#f6d8ff",
    alertOxyBg: "rgba(64, 12, 12, 0.92)",
    alertOxyBorder: "#ff5252",
    alertOxyFg: "#ffe4e4",
    alertAngryBg: "rgba(64, 24, 4, 0.92)",
    alertAngryBorder: "#ff9100",
    alertAngryFg: "#fff0d6",
  },
  hc: {
    frameBg: "#000000",
    sky: "#102838",
    waterStops: ["#07243b", "#031321", "#000000"],
    surfaceLine: "#ffffff",
    depthLine: "#00e5ff",
    depthText: "#00ffff",
    dockFill: "#ffff00",
    dockRoof: "#ffffff",
    dockRing: "#ffff00",
    dockText: "#ffff00",
    nodeText: "#ffffff",
    fishText: "#ffffff",
    monsterIdle: "#ff9100",
    monsterChase: "#ff1744",
    monsterRecoil: "#e040fb",
    monsterStroke: "#ffffff",
    player: "#00ffff",
    playerRing: "#ffff00",
    floor: "#121212",
    floorBorder: "#ffff00",
    stoveIdle: "#616161",
    stoveCook: "#ffab00",
    stoveReady: "#00e676",
    tableFill: "#1b4d89",
    custWait: "#ff80ab",
    custEat: "#00e676",
    hudMain: "#ffffff",
    hudMuted: "#e0e0e0",
    hudHint: "#ffff00",
    alertMonsterBg: "#000000",
    alertMonsterBorder: "#ffff00",
    alertMonsterFg: "#ffff00",
    alertOxyBg: "#000000",
    alertOxyBorder: "#00ffff",
    alertOxyFg: "#ffffff",
    alertAngryBg: "#000000",
    alertAngryBorder: "#ffea00",
    alertAngryFg: "#ffffff",
  }
};

let highContrast = false;
try {
  const params = new URLSearchParams(location.search);
  highContrast = params.get("hc") === "1" || localStorage.getItem("chonoi_high_contrast") === "1";
} catch (e) {}

const pal = () => (highContrast ? PALETTE.hc : PALETTE.normal);
const kc = (k) => (highContrast ? KIND_COLOR_HC[k] : KIND_COLOR[k]) || "#ffffff";

function applyHighContrast() {
  document.body.classList.toggle("hc", highContrast);
  if (hcHudBtn) hcHudBtn.textContent = `[H] Tương phản cao: ${highContrast ? "BẬT" : "TẮT"}`;
}

function toggleHighContrast(forceVal) {
  highContrast = typeof forceVal === "boolean" ? forceVal : !highContrast;
  try { localStorage.setItem("chonoi_high_contrast", highContrast ? "1" : "0"); } catch (e) {}
  applyHighContrast();
  overlaySignature = "";
  syncOverlay();
}

applyHighContrast();
if (hcHudBtn) hcHudBtn.onclick = () => toggleHighContrast();

let snap = null;
let offline = false;
let screen = "boot"; // boot | menu | day_intro | play | evening_intro | day_result | summary | quit
let dayIntroDeadline = 0;
let prevPhase = null;
let prevDay = null;
let overlaySignature = "";

const down = new Set();
const MOVE_KEYS = {
  w: "u", arrowup: "u",
  s: "d", arrowdown: "d",
  a: "l", arrowleft: "l",
  d: "r", arrowright: "r"
};
let queue = [], inflight = false, lastSent = "";

function apiPost(path, obj) {
  return fetch(path, {
    method: "POST",
    body: JSON.stringify(obj || {}),
    headers: { "Content-Type": "application/json" }
  }).catch(() => {});
}

function setUiPause(paused) {
  return apiPost("/ui_pause", { paused: !!paused });
}

function pulseButton(btn) {
  apiPost("/input", { [btn]: true }).then(() => apiPost("/input", { [btn]: false }));
}

function currentInput() {
  const ph = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (ph === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}

function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}

async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}

function enterDayIntro(dayNum) {
  screen = "day_intro";
  dayIntroDeadline = performance.now() + 4000;
  setUiPause(true);
  overlaySignature = "";
}

function startGameplay() {
  screen = "play";
  overlaySignature = "";
  setUiPause(false);
}

function startNewRun() {
  down.clear();
  lastSent = "";
  apiPost("/restart", {}).then(() => {
    prevPhase = "gather";
    prevDay = 1;
    enterDayIntro(1);
  });
}

function goMainMenu() {
  down.clear();
  lastSent = "";
  apiPost("/restart", {}).then(() => {
    screen = "menu";
    overlaySignature = "";
    setUiPause(true);
  });
}

function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;

  if (k === "h") {
    toggleHighContrast();
    return;
  }

  if (screen === "day_intro") {
    startGameplay();
    return;
  }
  if (screen === "evening_intro" && (k === "enter" || k === " " || k === "e")) {
    startGameplay();
    return;
  }
  if (screen === "day_result" && (k === "enter" || k === " " || k === "e")) {
    startGameplay();
    return;
  }

  if (k === "escape" || k === "p") {
    if (screen === "play" && snap && !snap.finished) {
      down.clear();
      pushInput();
      pulseButton("pause");
    }
    return;
  }

  if (snap && snap.state === "paused") return;

  if (screen === "play" && snap && snap.phase === "shop") {
    if (k === "1") apiPost("/input", { buy: "oxygen" });
    else if (k === "2") apiPost("/input", { buy: "hp" });
    else if (k === "enter" || k === " " || k === "e") pulseButton("shop_done");
    return;
  }

  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add("interact");
  else if (k === " ") down.add("catch");
  else if (k === "r") {
    if (snap && snap.mode === "day") startNewRun();
    else { apiPost("/restart", {}); lastSent = ""; down.clear(); }
  }
  pushInput();
});

addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const nextSnap = await r.json();
    offline = false;

    if (screen === "boot") {
      if (nextSnap.mode === "day") {
        screen = "menu";
        prevPhase = nextSnap.phase;
        prevDay = nextSnap.day;
        setUiPause(true);
      } else {
        screen = "play";
        prevPhase = nextSnap.phase;
        prevDay = nextSnap.day;
      }
    } else if (nextSnap.mode === "day" && screen === "play") {
      if (nextSnap.finished) {
        screen = "summary";
      } else if (prevDay !== null && nextSnap.day !== prevDay) {
        down.clear(); pushInput();
        enterDayIntro(nextSnap.day);
      } else if (prevPhase === "gather" && nextSnap.phase === "quan") {
        down.clear(); pushInput();
        screen = "evening_intro";
        setUiPause(true);
      } else if (prevPhase === "quan" && nextSnap.phase === "shop") {
        down.clear(); pushInput();
        screen = "day_result";
        setUiPause(true);
      }
      prevPhase = nextSnap.phase;
      prevDay = nextSnap.day;
    } else {
      prevPhase = nextSnap.phase;
      prevDay = nextSnap.day;
    }

    if (screen === "day_intro" && performance.now() >= dayIntroDeadline) {
      startGameplay();
    }
    snap = nextSnap;
    syncOverlay();
  } catch (e) {
    offline = true;
    syncOverlay();
  }
  setTimeout(poll, 16);
}
poll();

// ---------- DOM overlays (Menu, Intros, Result, Shop, Pause, Summary) ----------
function spoiledCut() {
  return (snap && snap.meta && snap.meta.freshness && snap.meta.freshness.spoiled_below) ?? 30;
}

function fmtStockList(items) {
  const arr = Array.isArray(items) ? items : [];
  if (!arr.length) return "Kho trống (0 món mang về)";
  const cut = spoiledCut();
  const freshCounts = {};
  const minFresh = {};
  let spoiledCount = 0;
  arr.forEach((it) => {
    const f = it.fresh ?? 100;
    if (f < cut) {
      spoiledCount += 1;
    } else {
      freshCounts[it.kind] = (freshCounts[it.kind] || 0) + 1;
      minFresh[it.kind] = minFresh[it.kind] === undefined ? f : Math.min(minFresh[it.kind], f);
    }
  });
  const parts = Object.keys(freshCounts).map(
    (k) => `${KIND_NAME[k] || k} ×${freshCounts[k]} (≥${Math.floor(minFresh[k])}%)`
  );
  if (spoiledCount > 0) parts.push(`Ươn ×${spoiledCount}`);
  return parts.length ? parts.join(" · ") : "Kho trống";
}

function syncOverlay() {
  if (!snap) return;

  if (snap.mode === "day" && snap.state === "paused" && screen === "play") {
    const sig = `pause:${highContrast ? 1 : 0}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Tạm dừng (Ngày ${snap.day})</h2>
        <p class="muted">Mọi đồng hồ và bộ đếm (kể cả Shop) đã dừng lại.</p>
        <div class="row">
          <button id="btn-resume">Tiếp tục (Esc / P)</button>
          <button id="btn-hc" class="secondary">[H] Tương phản cao: ${highContrast ? "BẬT" : "TẮT"}</button>
          <button id="btn-menu" class="secondary">Về menu</button>
        </div>`;
      cardEl.querySelector("#btn-resume").onclick = () => pulseButton("pause");
      cardEl.querySelector("#btn-hc").onclick = () => toggleHighContrast();
      cardEl.querySelector("#btn-menu").onclick = goMainMenu;
    }
    overlayEl.classList.add("show");
    return;
  }

  if (snap.mode !== "day" && snap.state === "paused") {
    const sig = `pause-single:${highContrast ? 1 : 0}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Tạm dừng</h2>
        <p class="muted">Đồng hồ và bộ đếm gameplay đang dừng.</p>
        <div class="row">
          <button id="btn-resume">Tiếp tục (Esc / P)</button>
          <button id="btn-hc" class="secondary">[H] Tương phản cao: ${highContrast ? "BẬT" : "TẮT"}</button>
        </div>`;
      cardEl.querySelector("#btn-resume").onclick = () => pulseButton("pause");
      cardEl.querySelector("#btn-hc").onclick = () => toggleHighContrast();
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "menu") {
    const sig = `menu:${highContrast ? 1 : 0}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h1>Quán Ăn Chợ Nổi</h1>
        <p>Theo chân Út Sen lặn bắt cá, hái rau trên sông Chín Khúc và mở quán phục vụ khách qua 5 Ngày ở Rạch Sen.</p>
        <p class="muted">WASD / Mũi tên: Bơi &amp; Đi · E: Hái / Bến / Nấu / Bưng · Space: Bắt cá · Esc / P: Tạm dừng · H: Tương phản cao</p>
        <div class="row">
          <button id="btn-play">Chơi (5 Ngày)</button>
          <button id="btn-hc" class="secondary">[H] Tương phản cao: ${highContrast ? "BẬT" : "TẮT"}</button>
          <button id="btn-quit" class="secondary">Thoát</button>
        </div>`;
      cardEl.querySelector("#btn-play").onclick = startNewRun;
      cardEl.querySelector("#btn-hc").onclick = () => toggleHighContrast();
      cardEl.querySelector("#btn-quit").onclick = () => {
        screen = "quit";
        overlaySignature = "";
        setUiPause(true);
        syncOverlay();
        window.close();
      };
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "quit") {
    if (overlaySignature !== "quit") {
      overlaySignature = "quit";
      cardEl.innerHTML = `<h2>Đã thoát game</h2><p>Hẹn gặp lại Út Sen tại Chợ Nổi Rạch Sen. Bạn có thể đóng tab trình duyệt này.</p>
        <div class="row"><button id="btn-back" class="secondary">Quay lại Menu</button></div>`;
      cardEl.querySelector("#btn-back").onclick = goMainMenu;
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "day_intro") {
    const plan = snap.day_plan || {};
    const dishList = Object.keys(plan.dishes || {}).map((d) => `<li>${DISH_NAME[d] || d}: <b>${plan.dishes[d]} suất</b></li>`).join("");
    const ingList = Object.keys(plan.ingredients || {}).map((k) => `${KIND_NAME[k] || k} ×${plan.ingredients[k]}`).join(" · ");
    const secLeft = Math.max(1, Math.ceil((dayIntroDeadline - performance.now()) / 1000));
    const sig = `day_intro:${snap.day}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Ngày ${snap.day} — Lời dặn của Má Tư</h2>
        <p>Hôm nay quán định nấu các món sau:</p>
        <ul>${dishList}</ul>
        <p><b>Cần lấy trên sông:</b> ${ingList}</p>
        <div class="row">
          <button id="btn-go">Xuống sông ngay (tự chuyển sau <span id="intro-sec">${secLeft}</span>s hoặc bấm phím bất kỳ)</button>
        </div>`;
      cardEl.querySelector("#btn-go").onclick = startGameplay;
    } else {
      const sp = cardEl.querySelector("#intro-sec");
      if (sp) sp.textContent = String(secLeft);
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "evening_intro") {
    const stArr = (snap.ui_stats && snap.ui_stats.handoff_stock) || [];
    const cut = spoiledCut();
    const freshCounts = {};
    (Array.isArray(stArr) ? stArr : []).forEach((it) => {
      if ((it.fresh ?? 100) >= cut) freshCounts[it.kind] = (freshCounts[it.kind] || 0) + 1;
    });
    const plan = (snap.day_plan && snap.day_plan.dishes) || {};
    const menu = (snap.meta && snap.meta.menu) || {};
    const cookable = Object.keys(plan).filter((d) => {
      const rec = (menu[d] && menu[d].recipe) || {};
      return Object.keys(rec).every((k) => (freshCounts[k] || 0) >= rec[k]);
    });
    const sig = `evening_intro:${snap.day}:${JSON.stringify(stArr)}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Buổi tối Ngày ${snap.day} — Chuẩn bị mở quán</h2>
        <p><b>Nguyên liệu nhập kho:</b> ${fmtStockList(stArr)}</p>
        <p><b>Món nấu được (đủ hàng tươi):</b> ${cookable.length ? cookable.map((d) => DISH_NAME[d] || d).join(" · ") : "Không đủ nguyên liệu tươi cho món nào"}</p>
        <div class="row"><button id="btn-open">Mở quán phục vụ (Enter / Space / E)</button></div>`;
      cardEl.querySelector("#btn-open").onclick = startGameplay;
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "day_result") {
    const ds = (snap.ui_stats && snap.ui_stats.day) || {};
    const repDelta = (ds.rep_end || 0) - (ds.rep_start || 0);
    const repTxt = (repDelta >= 0 ? "+" : "") + repDelta.toFixed(1);
    const sig = `day_result:${snap.day}:${ds.shift_earned}:${ds.served_count}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Tổng kết Ngày ${snap.day}</h2>
        <p><b>Khách đã phục vụ:</b> ${ds.served_count || 0} &nbsp;·&nbsp; <b>Khách bỏ đi:</b> ${ds.left_count || 0}</p>
        <p><b>Doanh thu ca tối:</b> ${ds.shift_earned || 0}k (gồm boa: ${ds.shift_tips || 0}k)</p>
        <p><b>Uy tín thay đổi:</b> ${repTxt} (hiện tại: ${(snap.reputation ?? 0).toFixed(1)} ★)</p>
        <p><b>Tiền khả dụng:</b> ${snap.money ?? 0}k</p>
        <div class="row"><button id="btn-shop">Vào tiệm nâng cấp (Enter / Space / E)</button></div>`;
      cardEl.querySelector("#btn-shop").onclick = startGameplay;
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "play" && snap.phase === "shop") {
    const shop = (snap.meta && snap.meta.shop) || {};
    const ups = shop.upgrades || {};
    const bought = snap.upgrades || {};
    const active = snap.active_upgrades || {};
    const oxLvl = bought.oxygen || 0, hpLvl = bought.hp || 0;
    const oxNext = (ups.oxygen || [])[oxLvl], hpNext = (ups.hp || [])[hpLvl];
    const shopSec = Math.ceil((snap.time_left_ticks || 0) / 60);
    const sig = `shop:${snap.day}:${snap.money}:${oxLvl}:${hpLvl}:${JSON.stringify(snap.stock || {})}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h2>Tiệm nâng cấp cuối Ngày ${snap.day}</h2>
        <p><b>Tiền:</b> ${snap.money ?? 0}k &nbsp;·&nbsp; <b>Tự đóng sau:</b> <span id="shop-sec">${shopSec}</span>s &nbsp;·&nbsp; <span class="muted">(Cấp mới áp dụng từ Ngày kế)</span></p>
        <p class="muted">Kho dư hôm nay (sẽ bỏ sau khi đóng Shop): ${fmtStockList(snap.stock)}</p>
        <div class="grid2">
          <div class="shop-box">
            <h3>Bình oxy (Cấp ${oxLvl}/2 · Đang dùng: Cấp ${active.oxygen || 0})</h3>
            <p>${oxNext ? `Cấp ${oxNext.level}: ${oxNext.oxygen_max_s}s oxy — Giá ${oxNext.price}k` : "Đã đạt cấp tối đa"}</p>
            <button id="buy-ox" ${!oxNext || (snap.money || 0) < oxNext.price ? "disabled" : ""}>[1] Mua Bình oxy</button>
          </div>
          <div class="shop-box">
            <h3>Áo phao (Cấp ${hpLvl}/2 · Đang dùng: Cấp ${active.hp || 0})</h3>
            <p>${hpNext ? `Cấp ${hpNext.level}: ${hpNext.hp_max} Máu — Giá ${hpNext.price}k` : "Đã đạt cấp tối đa"}</p>
            <button id="buy-hp" ${!hpNext || (snap.money || 0) < hpNext.price ? "disabled" : ""}>[2] Mua Áo phao</button>
          </div>
        </div>
        <div class="row">
          <button id="btn-done">Đóng Shop &amp; Sang ngày kế (Enter / E)</button>
        </div>`;
      cardEl.querySelector("#buy-ox").onclick = () => apiPost("/input", { buy: "oxygen" });
      cardEl.querySelector("#buy-hp").onclick = () => apiPost("/input", { buy: "hp" });
      cardEl.querySelector("#btn-done").onclick = () => pulseButton("shop_done");
    } else {
      const sp = cardEl.querySelector("#shop-sec");
      if (sp) sp.textContent = String(shopSec);
    }
    overlayEl.classList.add("show");
    return;
  }

  if (screen === "summary") {
    const sales = (snap.ui_stats && snap.ui_stats.dish_sales) || {};
    const topDish = Object.keys(sales).sort((a, b) => sales[b] - sales[a])[0];
    const topTxt = topDish ? `${DISH_NAME[topDish] || topDish} (${sales[topDish]} suất)` : "Chưa có";
    const sig = `summary:${snap.tick}`;
    if (overlaySignature !== sig) {
      overlaySignature = sig;
      cardEl.innerHTML = `
        <h1>Tổng kết hành trình 5 Ngày</h1>
        <p><b>Tổng điểm:</b> ${snap.score ?? 0}</p>
        <p><b>Tiền còn lại:</b> ${snap.money ?? 0}k &nbsp;·&nbsp; <b>Tổng thu nhập (earned):</b> ${snap.earned ?? 0}k</p>
        <p><b>Uy tín cuối:</b> ${(snap.reputation ?? 0).toFixed(1)} ★</p>
        <p><b>Món bán chạy nhất:</b> ${topTxt}</p>
        <div class="row">
          <button id="btn-replay">Chơi lại (R)</button>
          <button id="btn-menu" class="secondary">Về menu</button>
        </div>`;
      cardEl.querySelector("#btn-replay").onclick = startNewRun;
      cardEl.querySelector("#btn-menu").onclick = goMainMenu;
    }
    overlayEl.classList.add("show");
    return;
  }

  overlaySignature = "";
  overlayEl.classList.remove("show");
}

// ---------- Vẽ canvas (>= 18px ở 1280x720) ----------
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "700 " : "") + (o.size || 18) + "px system-ui, \"Segoe UI\", Arial, sans-serif";
  ctx.fillStyle = o.color || "#f0f5f9";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function pillText(s, x, y, o = {}) {
  const size = o.size || 18;
  ctx.font = (o.bold ? "700 " : "") + size + "px system-ui, \"Segoe UI\", Arial, sans-serif";
  const m = ctx.measureText(s);
  const padX = o.padX ?? 8;
  const padY = o.padY ?? 4;
  const bw = m.width + padX * 2;
  const bh = size + padY * 2;
  let bx = x - padX;
  if (o.align === "center") bx = x - bw / 2;
  else if (o.align === "right") bx = x - bw + padX;
  const by = y - size - padY + 3;
  ctx.fillStyle = o.bg || (highContrast ? "#000000" : "rgba(10,18,26,0.82)");
  ctx.fillRect(bx, by, bw, bh);
  if (o.border) {
    ctx.strokeStyle = o.border;
    ctx.lineWidth = o.borderWidth || (highContrast ? 3 : 2);
    ctx.strokeRect(bx, by, bw, bh);
  }
  text(s, x, y, { size, bold: o.bold, align: o.align, color: o.color || "#ffffff" });
}
function drawAlertBanner(msg, w, y, bg, border, fg) {
  const size = highContrast ? 23 : 22;
  ctx.font = `700 ${size}px system-ui, "Segoe UI", Arial, sans-serif`;
  const tw = ctx.measureText(msg).width;
  const bw = Math.min(w - 48, Math.max(420, tw + 44));
  const bh = 38;
  const bx = (w - bw) / 2;
  const by = y - bh / 2;
  ctx.fillStyle = bg;
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = border;
  ctx.lineWidth = highContrast ? 4 : 3;
  ctx.strokeRect(bx, by, bw, bh);
  text(msg, w / 2, y + 8, { size, align: "center", color: fg, bold: true });
  return y + bh + 8;
}
function bar(x, y, w, h, frac, color, label, opts = {}) {
  ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.58)";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = opts.border || (highContrast ? "#ffffff" : "rgba(255,255,255,.55)");
  ctx.lineWidth = opts.borderWidth || (highContrast ? 2 : 1);
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) {
    text(label, x + w / 2, y + h - 5, {
      size: 18, align: "center", bold: true, color: opts.labelColor || "#ffffff"
    });
  }
}
function fmtTime(ticks) {
  const s = Math.ceil((ticks || 0) / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function dist2(a, b) {
  return Math.hypot(a[0] - b[0], a[1] - b[1]);
}

function drawGather(w, h) {
  const P = pal();
  const meta = snap.meta || {};
  const gcfg = meta.gather_cfg || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 104, bottom = 78;
  const s = Math.max(1, Math.min((w - 24) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Trời & mặt cắt sông
  ctx.fillStyle = P.sky;
  ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, P.waterStops[0]);
  g.addColorStop(0.35, P.waterStops[1]);
  g.addColorStop(1, P.waterStops[2]);
  ctx.fillStyle = g;
  ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = P.surfaceLine;
  ctx.lineWidth = highContrast ? 3 : 2;
  ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

  // Vạch vùng nông / giữa / sâu (10m, 20m, 30m)
  for (let d = 10; d <= D; d += 10) {
    ctx.strokeStyle = P.depthLine;
    ctx.lineWidth = highContrast ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + "m", sx(0) + 6, sy(d) - 4, { size: 18, color: P.depthText, bold: highContrast });
  }

  // Bến
  const dp = meta.dock_pos || gcfg.dock_pos || [2, 0];
  const dr = meta.dock_radius || gcfg.dock_radius || 3;
  ctx.fillStyle = P.dockFill;
  ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = P.dockRoof;
  ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7));
  ctx.lineTo(sx(dp[0]), sy(-2.5));
  ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7));
  ctx.fill();
  ctx.strokeStyle = P.dockRing;
  ctx.lineWidth = highContrast ? 3 : 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  if (highContrast) pillText("Bến", sx(dp[0]), sy(-2.9), { size: 18, align: "center", color: P.dockText, bold: true, border: "#ffff00" });
  else text("Bến", sx(dp[0]), sy(-2.9), { size: 18, align: "center", color: P.dockText, bold: true });

  // Nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 1.0 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (highContrast) pillText(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.85 * s, { size: 18, align: "center", color: P.nodeText, bold: true });
    else text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.8 * s, { size: 18, align: "center", color: P.nodeText });
    if (!ready && n.regrow_ticks) {
      text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.6 * s, { size: 18, align: "center", color: "#fff", bold: highContrast });
    }
  });

  // Đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save();
    ctx.translate(sx(f.pos[0]), sy(f.pos[1]));
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.8 * s, { size: 18, align: "center", color: P.fishText, bold: highContrast });
  });

  // Thủy quái (Cá Sấu Năm Chèo)
  const nearMonsters = [];
  const p = snap.player;
  const detectR = ((gcfg.monsters && gcfg.monsters.species && gcfg.monsters.species.ca_sau && gcfg.monsters.species.ca_sau.detect_radius) || 10);
  (snap.monsters || []).forEach((m) => {
    const md = p ? dist2(m.pos, p.pos) : Infinity;
    const isNear = m.state === "chase" || md <= detectR;
    if (isNear) nearMonsters.push({ m, dist: md });
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    ctx.fillStyle = m.state === "chase" ? P.monsterChase : (m.state === "recoil" ? P.monsterRecoil : P.monsterIdle);
    ctx.beginPath(); ctx.ellipse(mx, my, 1.5 * s, 0.65 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = isNear ? P.alertMonsterBorder : P.monsterStroke;
    ctx.lineWidth = isNear || highContrast ? 3 : 2;
    ctx.stroke();
    if (isNear) {
      ctx.save();
      ctx.strokeStyle = P.alertMonsterBorder;
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.ellipse(mx, my, 2.0 * s, 1.05 * s, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      pillText(m.state === "chase" ? `▲ ${m.id} ĐUỔI!` : `⚠ ${m.id} GẦN!`, mx, my - 1.15 * s, {
        size: 18, align: "center", bold: true,
        bg: P.alertMonsterBg, border: P.alertMonsterBorder, color: P.alertMonsterFg
      });
    } else {
      text(m.id, mx, my - 1.0 * s, { size: 18, align: "center", color: "#ffffff", bold: true });
    }
  });

  // Người chơi + gợi ý hái / cập bến
  let promptTxt = "";
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = P.playerRing;
      ctx.lineWidth = highContrast ? 2 : 1;
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = P.playerRing;
      ctx.lineWidth = highContrast ? 2 : 1;
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = P.player;
      ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
      if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.stroke(); }
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = highContrast ? "#000000" : "#fff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.95 * s, py + Math.sin(a) * 0.95 * s); ctx.stroke();
    }
    if (dist2(p.pos, dp) <= dr) {
      promptTxt = "[E] Cập bến giao hàng";
    } else if (!underwater) {
      const ir = meta.interact_radius || 2.0;
      const nearNode = (snap.nodes || []).find((n) => n.ready !== false && dist2(p.pos, n.pos) <= ir);
      if (nearNode) promptTxt = `[E] Hái ${KIND_NAME[nearNode.kind] || nearNode.kind}`;
    }
  }

  // Cảnh báo dễ nhận biết (chữ + biểu tượng + viền nét đứt, xếp chồng không đè)
  let alertY = top + 24;
  if (nearMonsters.length) {
    ctx.save();
    ctx.strokeStyle = P.alertMonsterBorder;
    ctx.lineWidth = highContrast ? 10 : 8;
    ctx.setLineDash([16, 8]);
    ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.restore();
    const chasing = nearMonsters.some((x) => x.m.state === "chase");
    const ids = nearMonsters.map((x) => x.m.id).join(", ");
    const minD = Math.min(...nearMonsters.map((x) => x.dist));
    const msg = chasing
      ? `⚠ THỦY QUÁI GẦN! ${ids} ĐANG ĐUỔI (${minD.toFixed(1)}m)`
      : `⚠ THỦY QUÁI GẦN! ${ids} cách ${minD.toFixed(1)}m`;
    alertY = drawAlertBanner(msg, w, alertY, P.alertMonsterBg, P.alertMonsterBorder, P.alertMonsterFg);
  }
  const oxyMax = p && p.oxygen_max_ticks ? p.oxygen_max_ticks : 0;
  const emptyOxy = !!(p && p.oxygen_ticks === 0);
  const lowOxy = !!(p && oxyMax > 0 && p.oxygen_ticks > 0 && p.oxygen_ticks < oxyMax * 0.25);
  if (emptyOxy) {
    alertY = drawAlertBanner(
      "☠ HẾT OXY — ĐANG NGẠT! LÊN MẶT NƯỚC NGAY!",
      w, alertY, P.alertOxyBg, P.alertOxyBorder, P.alertOxyFg
    );
  } else if (lowOxy) {
    alertY = drawAlertBanner(
      `🫧 OXY SẮP HẾT! Còn ${Math.ceil(p.oxygen_ticks / 60)}s — LÊN MẶT NƯỚC!`,
      w, alertY, P.alertOxyBg, P.alertOxyBorder, P.alertOxyFg
    );
  }
  if (promptTxt) {
    pillText(promptTxt, w / 2, h - bottom - 14, {
      size: 20, align: "center", color: "#ffff00", bold: true, border: highContrast ? "#ffff00" : null
    });
  }

  // HUD trên (>= 18px)
  const dayTag = snap.day ? `Ngày ${snap.day} · ` : "";
  const timeLow = (snap.time_left_ticks || 0) <= 30 * 60;
  text(dayTag + "⏱ " + fmtTime(snap.time_left_ticks), 16, 32, {
    size: 22, color: timeLow ? "#ff5252" : P.hudMain, bold: true
  });

  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    const oxyColor = low
      ? (Math.floor(snap.tick / 10) % 2 ? "#ff1744" : "#ff9100")
      : (highContrast ? "#00b0ff" : "#29b6f6");
    const oxyLbl = (low ? "⚠ " : "") + "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s";
    bar(220, 10, 260, 28, p.oxygen_ticks / p.oxygen_max_ticks, oxyColor, oxyLbl, {
      border: low ? (highContrast ? "#ffff00" : "#ff5252") : (highContrast ? "#ffffff" : "rgba(255,255,255,.55)"),
      borderWidth: low || highContrast ? 3 : 1
    });
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
    text(hs.trim(), 500, 32, { size: 24, color: highContrast ? "#ff5252" : "#ff6b81", bold: true });
  }
  if (p && p.pos) {
    const zone = p.pos[1] < 10 ? "Nông" : (p.pos[1] < 20 ? "Giữa" : "Sâu");
    text(`Sâu: ${p.pos[1].toFixed(1)}m (${zone})`, 16, 66, { size: 18, color: P.hudMuted, bold: highContrast });
  }
  if (p && p.catch_cd_ticks > 0) {
    text("Hồi bắt: " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 220, 66, { size: 18, color: "#ffff00", bold: highContrast });
  }

  // Danh sách cần lấy đầu Ngày (chỉ tính cá thể chưa ươn)
  const cut = spoiledCut();
  const needMap = (snap.day_plan && snap.day_plan.ingredients) || {};
  if (Object.keys(needMap).length) {
    const counts = {};
    (snap.hold || []).forEach((it) => {
      if ((it.fresh ?? 100) >= cut) counts[it.kind] = (counts[it.kind] || 0) + 1;
    });
    const needStr = Object.keys(needMap).map((k) => `${KIND_NAME[k] || k} ${counts[k] || 0}/${needMap[k]}`).join(" · ");
    text("Cần lấy: " + needStr, 16, 94, { size: 18, color: highContrast ? "#ffff00" : "#ffe0a3", bold: highContrast });
  }

  // Giỏ dưới (hiển thị thanh độ tươi & cảnh báo ươn từng ô)
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity;
    const sz = Math.min(34, Math.max(20, (w - 420) / cap - 4));
    const y0 = h - bottom + 10;
    for (let i = 0; i < cap; i++) {
      const x0 = 16 + i * (sz + 4);
      ctx.fillStyle = highContrast ? "#1a1a1a" : "rgba(255,255,255,.14)";
      ctx.fillRect(x0, y0, sz, sz);
      if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, sz, sz); }
      const it = snap.hold[i];
      if (it) {
        const f = it.fresh ?? 100;
        const spoiled = f < cut;
        ctx.globalAlpha = spoiled ? 0.45 : 1;
        ctx.fillStyle = kc(it.kind);
        ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        ctx.globalAlpha = 1;
        ctx.fillStyle = spoiled ? "#ff1744" : (f < 50 ? "#ffea00" : "#00e676");
        ctx.fillRect(x0 + 3, y0 + sz - 6, Math.max(2, (sz - 6) * (f / 100)), 4);
        if (spoiled) {
          ctx.strokeStyle = "#ff5252";
          ctx.lineWidth = 2.5;
          ctx.strokeRect(x0 + 1, y0 + 1, sz - 2, sz - 2);
        }
      }
    }
    const freshNames = {};
    let spoiledCnt = 0;
    snap.hold.forEach((it) => {
      if ((it.fresh ?? 100) < cut) spoiledCnt += 1;
      else freshNames[it.kind] = (freshNames[it.kind] || 0) + 1;
    });
    const freshTxt = Object.keys(freshNames).map((k) => `${KIND_NAME[k] || k}×${freshNames[k]}`).join(", ");
    const spTxt = spoiledCnt ? ` · ⚠ Ươn×${spoiledCnt}` : "";
    text(`Giỏ ${snap.hold.length}/${cap}: ${freshTxt || "(chưa có đồ tươi)"}${spTxt}`, 16, y0 + sz + 22, {
      size: 18, color: spoiledCnt ? "#ff8a80" : P.hudMain, bold: highContrast
    });
  }
  text("WASD bơi · E hái/bến · Space bắt · Esc/P dừng · H tương phản cao", w - 16, h - 14, { size: 18, align: "right", color: P.hudHint });
}

function drawQuan(w, h) {
  const P = pal();
  const meta = snap.meta || {};
  const qcfg = meta.quan_cfg || {};
  const b = meta.bounds || qcfg.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 96, bottom = 46;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = P.floor; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = P.floorBorder; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? P.stoveCook : st.state === "ready" ? P.stoveReady : P.stoveIdle;
    ctx.fillStyle = col;
    ctx.fillRect(sx(st.pos[0]) - 0.85 * s, sy(st.pos[1]) - 0.85 * s, 1.7 * s, 1.7 * s);
    if (highContrast) {
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
      ctx.strokeRect(sx(st.pos[0]) - 0.85 * s, sy(st.pos[1]) - 0.85 * s, 1.7 * s, 1.7 * s);
    }
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 6, { size: 18, align: "center", color: "#000000", bold: true });
    if (st.dish) {
      const lbl = `${DISH_NAME[st.dish.dish_id] || st.dish.dish_id} (${st.dish.order_id})`;
      if (highContrast) pillText(lbl, sx(st.pos[0]), sy(st.pos[1]) - 1.0 * s, { size: 18, align: "center", color: "#ffffff", bold: true });
      else text(lbl, sx(st.pos[0]), sy(st.pos[1]) - 1.0 * s, { size: 18, align: "center", color: "#2a1a0a", bold: true });
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) {
      const tLbl = Math.ceil(st.cook_ticks_left / 60) + "s";
      if (highContrast) pillText(tLbl, sx(st.pos[0]), sy(st.pos[1]) + 1.4 * s, { size: 18, align: "center", color: "#ffff00", bold: true });
      else text(tLbl, sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, { size: 18, align: "center", color: "#2a1a0a", bold: true });
    }
    if (st.state === "ready") {
      if (highContrast) pillText("✓ Chín!", sx(st.pos[0]), sy(st.pos[1]) + 1.4 * s, { size: 18, align: "center", color: "#00e676", bold: true, border: "#00e676" });
      else text("Chín!", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, { size: 18, align: "center", color: "#154710", bold: true });
    }
  });

  // Bàn & khách + thu thập khách sắp giận
  const patMax = ((meta.patience_s || qcfg.patience_s || 60) * 60);
  const byTable = {};
  const angryList = [];
  (snap.customers || []).forEach((c) => {
    byTable[c.table_id] = c;
    if (c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left < patMax * 0.25) {
      angryList.push(c);
    }
  });
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = P.tableFill;
    ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke(); }
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 6, { size: 18, align: "center", color: "#ffffff", bold: true });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.55 * s;
      const isUrgent = c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left < patMax * 0.25;
      if (isUrgent) {
        ctx.save();
        ctx.strokeStyle = P.alertAngryBorder;
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.arc(cx, cy, 0.85 * s, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = c.state === "eating" ? P.custEat : P.custWait;
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
      const orderLbl = `${c.id}: ${DISH_NAME[c.dish_id] || c.dish_id}`;
      if (highContrast) pillText(orderLbl, cx, cy - 0.78 * s, { size: 18, align: "center", color: "#ffffff", bold: true });
      else text(orderLbl, cx, cy - 0.75 * s, { size: 18, align: "center", color: "#221406", bold: true });

      if (c.order_status === "unfulfillable") {
        pillText("✖ THIẾU HÀNG (ƯƠN)", cx, cy - 1.35 * s, {
          size: 16, align: "center", bold: true,
          bg: "#000000", border: "#ff5252", color: "#ff8a80"
        });
      }
      if (c.state === "waiting" && c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        bar(cx - 1.0 * s, cy + 0.65 * s, 2.0 * s, 12, frac, isUrgent ? "#ff1744" : "#00e676", "", {
          border: isUrgent ? P.alertAngryBorder : (highContrast ? "#ffffff" : "rgba(255,255,255,.55)"),
          borderWidth: isUrgent || highContrast ? 2.5 : 1
        });
        if (isUrgent) {
          pillText(`⚠ SẮP GIẬN! ${Math.ceil(c.patience_ticks_left / 60)}s`, cx, cy + 1.4 * s, {
            size: 17, align: "center", bold: true,
            bg: P.alertAngryBg, border: P.alertAngryBorder, color: P.alertAngryFg
          });
        }
      } else if (c.state === "eating") {
        const eatLbl = "Đang ăn " + Math.ceil((c.eat_ticks_left || 0) / 60) + "s";
        if (highContrast) pillText(eatLbl, cx, cy + 1.0 * s, { size: 18, align: "center", color: "#00e676", bold: true });
        else text(eatLbl, cx, cy + 0.95 * s, { size: 18, align: "center", color: "#143d14" });
      }
    }
  });

  // Người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = highContrast ? "#ffff00" : "rgba(255,255,255,.55)";
      ctx.lineWidth = highContrast ? 2.5 : 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = P.player;
    ctx.beginPath(); ctx.arc(px, py, 0.52 * s, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke(); }
    if (snap.hand) {
      const hand = `${DISH_NAME[snap.hand.dish_id] || snap.hand.dish_id} (${snap.hand.order_id})`;
      if (highContrast) pillText("Cầm: " + hand, px, py - 0.88 * s, { size: 18, align: "center", color: "#ffff00", bold: true, border: "#ffff00" });
      else text("Cầm: " + hand, px, py - 0.85 * s, { size: 18, align: "center", color: "#1a0e03", bold: true });
    }
  }

  // Cảnh báo khách sắp giận (chữ + biểu tượng + viền nét đứt)
  if (angryList.length) {
    ctx.save();
    ctx.strokeStyle = P.alertAngryBorder;
    ctx.lineWidth = highContrast ? 10 : 8;
    ctx.setLineDash([16, 8]);
    ctx.strokeRect(5, 5, w - 10, h - 10);
    ctx.restore();
    const listTxt = angryList
      .map((c) => `${c.table_id} (${c.id}: ${Math.ceil(c.patience_ticks_left / 60)}s)`)
      .join(", ");
    drawAlertBanner(`🔥 KHÁCH SẮP GIẬN! ${listTxt}`, w, top + 24, P.alertAngryBg, P.alertAngryBorder, P.alertAngryFg);
  }

  // HUD quán (>= 18px)
  const dayTag = snap.day ? `Ngày ${snap.day} · ` : "";
  const timeLow = (snap.time_left_ticks || 0) <= 30 * 60;
  text(dayTag + "⏱ " + fmtTime(snap.time_left_ticks), 16, 32, {
    size: 22, color: timeLow ? "#ff5252" : P.hudMain, bold: true
  });
  const shiftMoney = (snap.ui_stats && snap.ui_stats.day && snap.ui_stats.day.shift_earned) || 0;
  text(`Tiền ${snap.money ?? 0}k (ca +${shiftMoney}k) · Uy tín ${(snap.reputation ?? 0).toFixed(1)} ★ · Điểm ${snap.score ?? 0}`, 220, 32, {
    size: 20, color: P.hudMain, bold: highContrast
  });

  const cut = spoiledCut();
  const reservedIds = new Set();
  (snap.customers || []).forEach((c) => {
    (Array.isArray(c.reserved) ? c.reserved : []).forEach((iid) => reservedIds.add(iid));
  });
  const availFresh = {};
  const minFresh = {};
  let spoiledStock = 0;
  (Array.isArray(snap.stock) ? snap.stock : []).forEach((it) => {
    const f = it.fresh ?? 100;
    if (f < cut) {
      spoiledStock += 1;
    } else if (!reservedIds.has(it.id)) {
      availFresh[it.kind] = (availFresh[it.kind] || 0) + 1;
      minFresh[it.kind] = minFresh[it.kind] === undefined ? f : Math.min(minFresh[it.kind], f);
    }
  });
  const availText = Object.keys(availFresh).map(
    (k) => `${KIND_NAME[k] || k}×${availFresh[k]}(${Math.floor(minFresh[k])}%)`
  ).join(", ");
  const spoiledTag = spoiledStock ? ` · ⚠ Ươn×${spoiledStock}` : "";
  const handText = snap.hand ? `${DISH_NAME[snap.hand.dish_id] || snap.hand.dish_id} (${snap.hand.order_id})` : "trống";
  text("Kho khả dụng: " + (availText || "(trống)") + spoiledTag + "  ·  Tay: " + handText, 16, 68, {
    size: 18, color: spoiledStock ? "#ff8a80" : (highContrast ? "#ffff00" : "#ffe0a3"), bold: highContrast
  });
  text("WASD / Mũi tên đi · E bếp/bàn · Esc/P dừng · H tương phản cao · R chơi lại", w - 16, h - 14, { size: 18, align: "right", color: P.hudHint });
}

function drawStatusBanner(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 20 });
  if (snap && snap.error) text("Luật báo lỗi — xem terminal. R để chơi lại.", w / 2, 56, { align: "center", color: "#ff8a80", size: 20 });
  if (snap && snap.finished && snap.mode !== "day") {
    ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.6)";
    ctx.fillRect(w / 2 - 220, h / 2 - 58, 440, 116);
    if (highContrast) { ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 3; ctx.strokeRect(w / 2 - 220, h / 2 - 58, 440, 116); }
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 14, { align: "center", size: 22, color: "#ffffff", bold: true });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 24, { align: "center", size: 18, color: highContrast ? "#ffff00" : "#cfd8dc" });
  }
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = pal().frameBg;
  ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "quan") drawQuan(w, h);
    else drawGather(w, h);
    drawStatusBanner(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22, color: pal().hudMain });
  }
}
requestAnimationFrame(frame);
</script>
